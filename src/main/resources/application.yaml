logging:
  level:
    com.project.bookmyshow: DEBUG
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_booking?serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:ubona123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema predates Flyway, so an existing movie_booking database already has these
    # tables but no flyway_schema_history. Baselining records V1 as already applied instead
    # of failing on "table already exists". Harmless on an empty database.
    baseline-on-migrate: true
    baseline-version: 1
